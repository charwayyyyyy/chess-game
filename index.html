<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CHESS GAME - Classic Strategy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>THE CHESS GAME</h1>
      <p class="subtitle">Classic Strategy Game</p>
    </header>

    <main class="game-layout">
      
      <!-- Left/Center: The Chess Board and Status -->
      <section class="board-section">
        <div class="status-bar">
          <div class="turn-indicator" id="turn-indicator">White to Move</div>
          <div class="game-state" id="game-state"></div>
          <div class="score-display" id="score-display">Score: 0</div>
        </div>

        <div class="board-wrapper">
          <div class="chess-board" id="chess-board">
            <!-- Board squares will be generated by JS -->
          </div>
          <div class="promotion-modal hidden" id="promotion-modal">
            <h3>Promote Pawn</h3>
            <div class="promotion-options" id="promotion-options">
              <!-- Promotion options injected here -->
            </div>
          </div>
        </div>
      </section>

      <!-- Right: Sidebar Information and Controls -->
      <aside class="sidebar">
        
        <div class="panel controls-panel">
          <button class="btn primary" id="btn-new-game">New Game</button>
          <div class="btn-group">
            <button class="btn" id="btn-undo">Undo</button>
            <button class="btn" id="btn-hint">Hint</button>
            <button class="btn" id="btn-settings">Settings</button>
          </div>
        </div>

        <div class="panel captured-panel">
          <h3>Captured Material</h3>
          <div class="captured-row white-captures" id="white-captures"></div>
          <div class="captured-row black-captures" id="black-captures"></div>
        </div>

        <div class="panel history-panel">
          <h3>Move History</h3>
          <div class="history-list-wrapper">
            <ol class="history-list" id="history-list">
              <!-- History items will be generated by JS -->
            </ol>
          </div>
        </div>

      </aside>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="close-modal" id="close-settings">&times;</button>
      </div>
      <div class="modal-content">
        <div class="setting-group">
          <label class="setting-item">
            <span>Show Coordinate Labels</span>
            <input type="checkbox" id="setting-coords" checked>
          </label>
          <label class="setting-item">
            <span>Show Legal Moves Highlight</span>
            <input type="checkbox" id="setting-hints" checked>
          </label>
          <label class="setting-item">
            <span>Sound Effects</span>
            <input type="checkbox" id="setting-sound">
          </label>
        </div>
        <div class="setting-group">
          <label>Board Theme</label>
          <select id="setting-theme" class="theme-select">
            <option value="classic">Classic Wood</option>
            <option value="slate">Slate Gray</option>
            <option value="ocean">Ocean Blue</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal-overlay hidden" id="game-over-modal">
    <div class="modal game-over">
      <h2 id="game-over-title">Checkmate</h2>
      <p id="game-over-message">White Wins</p>
      <div class="modal-actions">
        <button class="btn primary" id="btn-play-again">Play Again</button>
        <button class="btn" id="btn-close-game-over">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
