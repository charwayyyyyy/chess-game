<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CHESS GAME </title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>THE CHESS GAME</h1>
      <p class="subtitle">Play with a friend or against the AI</p>
    </header>

    <main class="game-layout">
      <!-- Left/Center: The Chess Board and Status -->
      <section class="board-section">
        <div class="status-bar">
          <div class="turn-indicator" id="turn-indicator">
            <span class="indicator-dot" id="indicator-dot"></span>
            <span id="turn-text">White to Move</span>
          </div>
          <div class="game-state" id="game-state"></div>
          <div class="score-display" id="score-display">Even</div>
        </div>

        <div class="board-wrapper">
          <div class="chess-board" id="chess-board">
            <!-- Board squares will be generated by JS -->
          </div>
          
          <div class="promotion-modal hidden" id="promotion-modal">
            <h3>Promote Pawn</h3>
            <div class="promotion-options" id="promotion-options">
              <!-- Promotion options injected here -->
            </div>
          </div>
          
          <div class="ai-thinking-overlay hidden" id="ai-thinking-overlay">
            <div class="spinner"></div>
            <span>Opponent is thinking...</span>
          </div>
        </div>
      </section>

      <!-- Right: Sidebar Information and Controls -->
      <aside class="sidebar">
        
        <div class="panel controls-panel">
          <button class="btn primary btn-animate" id="btn-new-game">New Game</button>
          <div class="btn-group">
            <button class="btn btn-animate" id="btn-undo">Undo</button>
            <button class="btn btn-animate" id="btn-hint">Hint</button>
            <button class="btn btn-animate" id="btn-settings">Settings</button>
          </div>
        </div>

        <div class="panel captured-panel">
          <h3>Captured Pieces</h3>
          <div class="captured-group">
            <div class="captured-row white-captures" id="white-captures"></div>
            <span class="adv-badge hidden" id="white-adv"></span>
          </div>
          <div class="captured-group">
            <div class="captured-row black-captures" id="black-captures"></div>
            <span class="adv-badge hidden" id="black-adv"></span>
          </div>
        </div>

        <div class="panel history-panel">
          <h3>Move History</h3>
          <div class="history-list-wrapper" id="history-wrapper">
            <ol class="history-list" id="history-list">
              <!-- History items will be generated by JS -->
            </ol>
          </div>
        </div>

      </aside>
    </main>
  </div>

  <!-- Start Screen Modal -->
  <div class="modal-overlay" id="start-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Game Setup</h2>
      </div>
      <div class="modal-content">
        <div class="setting-group">
          <label class="setting-title">Game Mode</label>
          <div class="radio-group">
            <label class="radio-btn"><input type="radio" name="game-mode" value="pvp" checked> Player vs Player</label>
            <label class="radio-btn"><input type="radio" name="game-mode" value="pvc-w"> Play as White (vs AI)</label>
            <label class="radio-btn"><input type="radio" name="game-mode" value="pvc-b"> Play as Black (vs AI)</label>
          </div>
        </div>
        <div class="setting-group" id="difficulty-group" style="display: none;">
          <label class="setting-title">AI Difficulty</label>
          <div class="radio-group">
            <label class="radio-btn"><input type="radio" name="ai-difficulty" value="1"> Easy</label>
            <label class="radio-btn"><input type="radio" name="ai-difficulty" value="2" checked> Medium</label>
            <label class="radio-btn"><input type="radio" name="ai-difficulty" value="3"> Hard</label>
          </div>
        </div>
        <div class="modal-actions full-width">
          <button class="btn primary btn-animate" id="btn-start-game">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal fade-in-scale">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="close-modal btn-hover-anim" id="close-settings">&times;</button>
      </div>
      <div class="modal-content">
        <div class="setting-group">
          <label class="setting-item">
            <span>Show Coordinates</span>
            <input type="checkbox" id="setting-coords" checked>
          </label>
          <label class="setting-item">
            <span>Show Legal Move Hints</span>
            <input type="checkbox" id="setting-hints" checked>
          </label>
          <label class="setting-item">
            <span>Sound Effects</span>
            <input type="checkbox" id="setting-sound">
          </label>
        </div>
        <div class="setting-group">
          <label class="setting-title">Board Theme</label>
          <select id="setting-theme" class="theme-select form-input">
            <option value="classic">Classic Wood</option>
            <option value="slate">Slate Gray</option>
            <option value="ocean">Ocean Blue</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal-overlay hidden" id="game-over-modal">
    <div class="modal game-over fade-in-scale">
      <h2 id="game-over-title">Checkmate</h2>
      <p id="game-over-message" class="subtitle">White Wins</p>
      <div class="modal-actions center-align mt-2">
        <button class="btn primary btn-animate" id="btn-play-again">Review & Play Again</button>
        <button class="btn btn-animate" id="btn-close-game-over">View Board</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
